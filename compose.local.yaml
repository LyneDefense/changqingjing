services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-changqingjing}
      POSTGRES_USER: ${POSTGRES_USER:-changqingjing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changqingjing-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - changqingjing-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  changqingjing-postgres-data:
