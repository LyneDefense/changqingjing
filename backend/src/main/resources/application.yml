spring:
  application:
    name: changqingjing-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  mvc:
    log-request-details: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/changqingjing}
    username: ${DB_USERNAME:changqingjing}
    password: ${DB_PASSWORD:changqingjing-local}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never

app:
  admin:
    session:
      absolute-lifetime: 12h
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      login-name: ${ADMIN_BOOTSTRAP_LOGIN_NAME:}
      display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    accesslog:
      enabled: false
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /internal/swagger-ui.html
  api-docs:
    path: /internal/openapi
