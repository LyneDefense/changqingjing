spring:
  application:
    name: changqingjing-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/changqingjing}
    username: ${DB_USERNAME:changqingjing}
    password: ${DB_PASSWORD:changqingjing-local}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /internal/swagger-ui.html
  api-docs:
    path: /internal/openapi
