spring:
  application:
    name: changqingjing-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  mvc:
    log-request-details: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/changqingjing}
    username: ${DB_USERNAME:changqingjing}
    password: ${DB_PASSWORD:changqingjing-local}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never

app:
  security:
    rate-limit:
      app-auth-per-minute: ${RATE_LIMIT_APP_AUTH_PER_MINUTE:30}
      admin-login-per-minute: ${RATE_LIMIT_ADMIN_LOGIN_PER_MINUTE:30}
      media-upload-per-minute: ${RATE_LIMIT_MEDIA_UPLOAD_PER_MINUTE:60}
      scenic-view-per-minute: ${RATE_LIMIT_SCENIC_VIEW_PER_MINUTE:120}
  wechat:
    enabled: ${WECHAT_ENABLED:false}
    mock-enabled: ${WECHAT_MOCK_ENABLED:false}
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    mock-phone: ${WECHAT_MOCK_PHONE:13800138000}
    phone-encryption-key-base64: ${APP_PHONE_ENCRYPTION_KEY_BASE64:}
    session-ttl: ${APP_SESSION_TTL:7d}
  media:
    object-prefix: ${COS_OBJECT_PREFIX:local}
    upload-credential-ttl: 15m
    read-url-ttl: 15m
    max-image-bytes: ${MEDIA_MAX_IMAGE_BYTES:10485760}
    max-video-bytes: ${MEDIA_MAX_VIDEO_BYTES:209715200}
    cleanup:
      interval-ms: ${MEDIA_CLEANUP_INTERVAL_MS:600000}
      initial-delay-ms: ${MEDIA_CLEANUP_INITIAL_DELAY_MS:600000}
    cos:
      enabled: ${COS_ENABLED:false}
      bucket: ${COS_BUCKET:}
      region: ${COS_REGION:}
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
  admin:
    session:
      absolute-lifetime: 12h
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      login-name: ${ADMIN_BOOTSTRAP_LOGIN_NAME:}
      display-name: ${ADMIN_BOOTSTRAP_DISPLAY_NAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    accesslog:
      enabled: false
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
    path: /internal/openapi
  swagger-ui:
    enabled: false
    path: /internal/swagger-ui.html
